<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#060913" stroke="url(#cyber-cyan)" stroke-width="1.5" />
  
  <!-- Glowing Letter M -->
  <path d="M25 70 V35 L50 55 L75 35 V70" fill="none" stroke="url(#cyber-cyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
  
  <!-- High-tech accent dot -->
  <circle cx="50" cy="30" r="4" fill="#00FF87" filter="url(#neon-glow)" />
</svg>
